<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&amp;family=Manrope:wght@400..700&amp;display=swap">
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (d.hasAttribute('data-intro') && !reduce && !sessionStorage.getItem('acds:intro')) d.classList.add('has-loader');
      } catch (e) { /* stockage indisponible : pas de loader */ }
      // Filet de sécurité : si le JS principal ne se charge pas, le contenu reste visible.
      setTimeout(function () { d.classList.add('is-ready'); d.classList.remove('has-loader'); }, 4500);
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/config.js" defer></script>
  <script type="module" src="/js/main.js"></script>
